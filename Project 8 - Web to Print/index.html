<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web to Print</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="title">
        <p>Essentials Only</p>
    </div>
  
    <div class="subtitle">
        <p>The “I Swear I Only Need Two Things” List</p>
    </div>
    
    <div class="controls">
        <div class="input-group">
            <label for="store-select">Select a Store:</label>
            <select id="store-select">
                <option value="">Choose a store...</option>
                <option value="Trader Joe's">Trader Joe's</option>
                <option value="Whole Foods">Whole Foods</option>
                <option value="Key Food">Key Food</option>
                <option value="Morton Williams">Morton Williams</option>
                <option value="Westside Market">Westside Market</option>
                <option value="Target">Target</option>
            </select>
        </div>

        <div class="input-group">
            <label for="item-input">Add Items (press Enter after each item):</label>
            <input type="text" id="item-input" placeholder="e.g., Bananas, Eggs, Milk...">
            <div id="current-items-preview"></div>
        </div>

        <div class="input-group">
            <label for="color-picker">Note Color:</label>
            <input type="color" id="color-picker" value="#ffaaa0">
        </div>

        <button class="add-more-btn" onclick="addStore()">Add Store to List</button>
        <button class="print-btn" onclick="window.print()">Print My List</button>
    </div>

    <div class="print-title">Essentials Only</div>

    <div class="basket-page">
        <img src="./assets/basket.png" alt="basket" class="basket-image">

        <div class="basket-container" id="basket">
            <div class="empty-state">
                Select a store and add items to start building your grocery list!
            </div>
        </div>
    </div>

    <a href="../index.html" class="home-button">Home</a>      

    <script src="script.js"></script>
</body>
</html>
